<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="container">
        <h2>Rock-Paper-Scissor Game</h2>
        <br>

        <p>Choose how many rounds you want to play</p>
        <div class="rounds">
            <button value="3">Best of 3</button>
            <button value="5">Best of 5</button>
            <button value="7">Best of 7</button>
            <button value="9">Best of 9</button>
        </div>

        <div class="choices">
            <p>Pick your item to start the game</p>
            <button class="chosen-btn" value="rock"><img src="./img/rock.png">ROCK</button>
            <button class="chosen-btn" value="paper"><img src="./img/paper.png">PAPER</button>
            <button class="chosen-btn" value="sissor"><img src="./img/sissor.png">SISSOR</button>
        </div>

        <div class="gameResult">
            <div>
                <h4>Your Choice:</h4>
                <h4 class="userImg"></h4>
                <h4 class="userChoice"></h4>
            </div>
            <div>
                <h4>Computer's Choice:</h4>
                <h4 class="compImg"></h4>
                <h4 class="compChoice"></h4>
            </div>
        </div>
        <h2 class="result"></h2>   
        <div class="score"></div>
    </div>

    <script src="main.js"></script>
</body>

</html>
