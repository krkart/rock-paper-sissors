<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="container">
        <h2>Rock-Paper-Scissor Game</h2>
        <br>
        <p>Choose your item to start the game.</p>
        <br>
        <button class="chosen-btn" value="rock">ROCK</button>
        <button class="chosen-btn" value="paper">PAPER</button>
        <button class="chosen-btn" value="sissor">SISSOR</button>
        <br>
        <p>You have chosen <span class="userChoice"></span>. Computer has chosen <span class="compChoice"></span>. <h3 class="result"></h3></span></p>   
    </div>

    <script src="main.js"></script>
</body>

</html>
