<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="container">
        <div class="box">
            <h2>Rock-Paper-Scissor Game</h2>
        </div>

        <p>Choose how many rounds you want to play</p>
        <div class="rounds">
            <button value="3">best of 3</button>
            <button value="5">best of 5</button>
            <button value="7">best of 7</button>
            <button value="9">best of 9</button>
        </div>

        <p>Pick your item to start the game</p>
        <div class="choices">
            <button class="pickBtn" value="rock"><img src="./img/rock.png">rock</button>
            <button class="pickBtn" value="paper"><img src="./img/paper.png">paper</button>
            <button class="pickBtn" value="sissor"><img src="./img/sissor.png">sissor</button>
        </div>

        <h4 class="result"></h4>   

        <div class="box">
            <div class="gameResult">
                <p>Your Choice:</p>
                <p class="userImg"></p>
                <p class="userChoice"></p>
            </div>
            <div class="gameResult">
                <p>Computer's Choice:</p>
                <p class="compImg"></p>
                <p class="compChoice"></p>
            </div>
        </div>
        <div class="score">
            <p>Your score = 0. Computer score = 0.</p>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
