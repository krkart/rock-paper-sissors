<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>

    <link rel="stylesheet" href="./main.css">
    <script defer src="./main.js"></script>
</head>

<body>
    <main>
        <div class="box">
            <h2>Rock-Paper-Scissor Game</h2>
        </div>

        <p>Choose how many rounds you want to play</p>
        <div class="rounds">
            <button value="3">best of 3</button>
            <button value="5">best of 5</button>
            <button value="7">best of 7</button>
            <button value="9">best of 9</button>
        </div>

        <p>Pick your item to start the game</p>
        <div class="choices">
            <button class="pick-btn" value="rock"><img src="./img/rock.png" />rock</button>
            <button class="pick-btn" value="paper"><img src="./img/paper.png" />paper</button>
            <button class="pick-btn" value="sissor"><img src="./img/sissor.png" />sissor</button>
        </div>

        <h4 class="result"></h4>

        <div class="box">
            <div class="game-result">
                <p>Your Choice:</p>
                <div class="user-img"></div>
                <p class="user-choice"></p>
            </div>
            <div class="result-sign">
                <h3>?</h3>
            </div>
            <div class="game-result">
                <p>Computer's Choice:</p>
                <div class="computer-img"></div>
                <p class="computer-choice"></p>
            </div>
        </div>
        <div class="score">
            <p>Your score = 0. Computer score = 0.</p>
        </div>
        <div id="overlay" class="hide">
            <div id="final-result"></div>
            <button onClick="window.location.reload();">Play Again</button>
        </div>
    </main>

    <footer>
        <p>
            <small>Copyleft 🄯 <time id="copyleft-current-year">2024</time>
                <a href="https://github.com/krkart">Karthikeyan</a>.
                No Right Reserved. <br>Developed with the help of Internet community.
            </small>
        </p>
    </footer>

    <script>
        function updateCopyright(initialYear) {
            const copyright = document.getElementById('copyleft-current-year');
            if (copyright) {
                const currYear = new Date().getFullYear();
                if (currYear === initialYear) {
                    copyright.textContent = initialYear;
                } else if (currYear > initialYear) {
                    copyright.textContent = `${initialYear}-${currYear}`;
                }
            }
        }
        updateCopyright(2024);
    </script>
</body>

</html>
